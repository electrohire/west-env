name: Container images

# Build and publish the per-Zephyr-version zephyr-build-env images to
# GHCR under the project's ElectroHire home:
#   ghcr.io/electrohire/zephyr-build-env:<zephyr>-sdk<sdk>-ubuntu22.04
# The newest supported version also carries :latest.
#
# Manual dispatch only: each image is large (a full Zephyr SDK), so
# publishing is a deliberate act, not a side effect of a push. Pick one
# version or "all". Every job verifies its own image after pushing
# (skills present, version overlay selected, SDK version, west), so a
# green job is the payload verdict for that image, not just transport.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Zephyr version to build (or all)"
        type: choice
        default: "all"
        options:
          - all
          - "4.0.0"
          - "4.1.0"
          - "4.2.0"
          - "4.3.0"
          - "4.4.0"
          - "4.5.0"

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  select:
    name: Select matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          all='[
            {"zephyr":"4.0.0","sdk":"0.17.0"},
            {"zephyr":"4.1.0","sdk":"0.17.0"},
            {"zephyr":"4.2.0","sdk":"0.17.2"},
            {"zephyr":"4.3.0","sdk":"0.17.4"},
            {"zephyr":"4.4.0","sdk":"1.0.1"},
            {"zephyr":"4.5.0","sdk":"1.0.1"}
          ]'
          if [ "${{ inputs.version }}" = "all" ]; then
            chosen="$all"
          else
            chosen="$(printf '%s' "$all" | jq -c --arg v "${{ inputs.version }}" '[.[] | select(.zephyr == $v)]')"
          fi
          echo "matrix={\"include\":$chosen}" >> "$GITHUB_OUTPUT"
          echo "Selected: $chosen"

  build:
    name: Image Zephyr ${{ matrix.zephyr }} (SDK ${{ matrix.sdk }})
    needs: [select]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          base="ghcr.io/electrohire/zephyr-build-env"
          tag="$base:${{ matrix.zephyr }}-sdk${{ matrix.sdk }}-ubuntu22.04"
          if [ "${{ matrix.zephyr }}" = "4.5.0" ]; then
            tag="$tag"$'\n'"$base:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tag"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: container
          push: true
          provenance: false
          sbom: false
          build-args: |
            ZEPHYR_VERSION=v${{ matrix.zephyr }}
            ZEPHYR_SDK_VERSION=${{ matrix.sdk }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Verify the published image
        run: |
          set -eu
          image="ghcr.io/electrohire/zephyr-build-env:${{ matrix.zephyr }}-sdk${{ matrix.sdk }}-ubuntu22.04"
          docker pull "$image"
          echo "== skills =="
          docker run --rm "$image" ls /opt/zephyr-skills/beningo
          echo "== version overlay =="
          docker run --rm "$image" head -3 /opt/zephyr-skills/version-overlay.md
          docker run --rm "$image" grep -F "Zephyr ${{ matrix.zephyr }}" /opt/zephyr-skills/version-overlay.md
          echo "== sdk =="
          sdk_seen="$(docker run --rm "$image" cat /opt/zephyr-sdk/sdk_version)"
          echo "sdk_version in image: $sdk_seen"
          test "$sdk_seen" = "${{ matrix.sdk }}"
          echo "== env =="
          z_seen="$(docker run --rm "$image" printenv WEST_ENV_ZEPHYR_VERSION)"
          s_seen="$(docker run --rm "$image" printenv WEST_ENV_ZEPHYR_SDK_VERSION)"
          echo "WEST_ENV_ZEPHYR_VERSION=$z_seen WEST_ENV_ZEPHYR_SDK_VERSION=$s_seen"
          test "$z_seen" = "v${{ matrix.zephyr }}"
          test "$s_seen" = "${{ matrix.sdk }}"
          echo "== west =="
          docker run --rm "$image" west --version
          echo "IMAGE_VERIFY_OK zephyr=${{ matrix.zephyr }} sdk=${{ matrix.sdk }}"
